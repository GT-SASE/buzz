version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - next
          - eslint-config-next
          - "@vercel/*"
      trpc:
        patterns:
          - "@trpc/*"
      drizzle:
        patterns:
          - drizzle-orm
          - drizzle-kit
          - eslint-plugin-drizzle
      radix:
        patterns:
          - radix-ui
          - "@radix-ui/*"
      tooling:
        patterns:
          - eslint
          - typescript-eslint
          - prettier
          - "prettier-plugin-*"
          - vitest
          - "@testing-library/*"
          - jsdom
    ignore:
      - dependency-name: next-auth
      - dependency-name: typescript
      - dependency-name: typescript-7
      # ESLint 10 crashes with eslint-config-next 16 / react-hooks 7
      # (scopeManager.addGlobals). Stay on 9 until those plugins support 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
