name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Public prerender must not require portal secrets in CI.
  SKIP_ENV_VALIDATION: "1"
  # Turborepo Remote Cache. Both are empty on fork PRs and until configured;
  # turbo then runs with the local .turbo/cache restored below.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Keep turbo's cache between runs so unchanged tasks replay.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: bun x turbo run //#lint

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      # tsrs is a beta Rust port of TypeScript 7.1: an early look that never
      # gates a merge. Its false positives have forced code workarounds before.
      - run: bun x turbo run typecheck //#typecheck:self
        continue-on-error: true
      # tsc is the deciding check until tsrs has a stable release.
      - run: bun x turbo run //#format:check typecheck:tsc //#typecheck:tsc:self

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/buzz
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/buzz
    steps:
      # The runner image ships PostgreSQL; starting it skips the ~20s service
      # container pull and health check.
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -q; do sleep 0.2; done
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb buzz
          psql "$DATABASE_URL" -tAc "select version()"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: bun run db:migrate
      - run: bun x turbo run //#test
      # The bot's unit tests and its PGlite database tests need no server.
      - run: bun x turbo run test test:db

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run vercel-build
      # Builds the bot's functions, then loads them from a folder outside the repo.
      - run: bun run --cwd sites/discord-bot build
      - run: bun run --cwd sites/discord-bot smoke

  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/install-gitleaks.sh
      - name: Refuse a .gitleaksignore file
        run: test ! -e .gitleaksignore
      - name: Scan every commit on every ref
        run: .tools/gitleaks git . --config .gitleaks.toml --redact --ignore-gitleaks-allow --no-banner --log-opts="--all -m --text --no-color"
