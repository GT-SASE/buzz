# Bun auto-loads the repo-root .env, which holds the deployment's DATABASE_URL.
# next.config.ts, drizzle.config.ts and tests/setup/env.ts already load it
# explicitly, so nothing needs the implicit load.
env = false

# Runs every `#!/usr/bin/env node` bin (eslint, tsc, prettier, drizzle-kit,
# next) on Bun, so neither CI nor a local checkout needs Node installed.
[run]
bun = true

[install]
linker = "isolated"
# eslint and prettier are declared once at the root but resolved from every
# workspace, so they have to sit in a place those workspaces can actually see.
publicHoistPattern = ["*eslint*", "*prettier*"]
# Links each peer from the tree (as pnpm did); off, typescript-eslint falls
# through to the hidden hoist and loads TypeScript 7, which it rejects.
peer = true

[test]
preload = ["./tests/setup/env.ts"]
