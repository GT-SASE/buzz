name: CI

# A branch with an open PR is tested once, by the PR. Pushes run only on main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Public prerender must not require portal secrets in CI.
  SKIP_ENV_VALIDATION: "1"
  # Turborepo Remote Cache. Both are empty on fork PRs and until configured;
  # turbo then runs with the local .turbo/cache restored below.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Keep turbo's cache between runs so unchanged tasks replay.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: bun x turbo run //#lint

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      # tsrs is a beta Rust port of TypeScript 7.1: an early look that never
      # gates a merge. Its false positives have forced code workarounds before.
      # The Go service is checked by the go job, which sets up Go.
      - run: bun x turbo run typecheck //#typecheck:self --filter='!@buzz/backend'
        continue-on-error: true
      # tsc is the deciding check until tsrs has a stable release.
      - run: bun x turbo run //#format:check typecheck:tsc //#typecheck:tsc:self

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/buzz
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/buzz
    steps:
      # The runner image ships PostgreSQL; starting it skips the ~20s service
      # container pull and health check.
      - name: Start Postgres
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -q; do sleep 0.2; done
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb buzz
          psql "$DATABASE_URL" -tAc "select version()"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: bun run db:migrate
      - run: bun x turbo run //#test

  # The bot's unit tests and its PGlite database tests need no server. They are
  # CPU-bound (every test file boots its own PGlite), so a job of their own
  # beats sharing the test job's four cores.
  bot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      # The filter keeps the root package's //#test out: turbo adds it to any `test` run.
      - run: bun x turbo run test test:db --filter=@buzz/discord-bot

  # The Go service in sites/backend. setup-go reads the toolchain line of its
  # go.mod. golangci-lint and govulncheck build from the module pinned in
  # tools/go.mod; its go.sum keys the module and build caches.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sites/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: sites/backend/go.mod
          cache-dependency-path: sites/backend/tools/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -short ./...
      - run: go tool -modfile=tools/go.mod golangci-lint run
      - run: go tool -modfile=tools/go.mod govulncheck ./...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Next's incremental build cache (turbo leaves .next/cache out of its own).
      # The exact key hits when nothing changed; otherwise the newest cache for
      # this lockfile, then any, seeds the build and Next recompiles what moved.
      # Before the install, so hashFiles never walks node_modules.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sites/web/.next/cache
          key: next-${{ hashFiles('bun.lock') }}-${{ hashFiles('sites/web/**', 'packages/*/src/**', '!**/node_modules/**') }}
          restore-keys: |
            next-${{ hashFiles('bun.lock') }}-
            next-
      - run: bun install --frozen-lockfile
      - run: bun run vercel-build
      # Gzipped JS and CSS per prerendered route against scripts/bundle-budget.mjs.
      - run: bun scripts/bundle-budget.mjs
      # axe on the built marketing routes; serious and critical violations fail.
      # The runner image ships Chrome, which playwright-core drives.
      - name: axe on marketing routes
        run: |
          bun run --cwd sites/web start -p 3000 > next-start.log 2>&1 &
          tries=0; until curl -sf -o /dev/null http://localhost:3000/; do tries=$((tries + 1)); [ $tries -ge 60 ] && { cat next-start.log; exit 1; }; sleep 1; done
          bun scripts/axe-marketing.mjs
          # The bot's routes refuse an unsigned interaction and a cron call without the secret.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/discord/interactions)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/cron/discord-reminders)" = 401

  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/install-gitleaks.sh
      - name: Refuse a .gitleaksignore file
        run: test ! -e .gitleaksignore
      - name: Scan every commit on every ref
        run: .tools/gitleaks git . --config config/gitleaks/gitleaks.toml --redact --ignore-gitleaks-allow --no-banner --log-opts="--all -m --text --no-color"
