name: Smoke test production

# Vercel reports each deployment back to GitHub. When a production deploy
# finishes, load the pages people actually hit and fail loudly if one is down.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check live pages
        # Hits the production domain from site.ts, not the per-deploy URL,
        # which can sit behind Vercel's login.
        run: bun scripts/smoke.mjs
