name: Smoke test production

# Vercel reports each deployment back to GitHub. When a production deploy
# finishes, load the pages people actually hit and fail loudly if one is down.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check live pages
        # Hits the production domain from site.ts, not the per-deploy URL,
        # which can sit behind Vercel's login.
        run: node scripts/smoke.mjs
